name: Set up JDK
description: Set up JDK 17 and the Gradle daemon JDK, with the Gradle cache that warm-gradle-cache.yml saves on main.

inputs:
  gradle-cache:
    required: false
    default: 'true'
    description: Set false to start with no Gradle cache, as release jobs do.
  kotlin-native:
    required: false
    default: 'false'
    description: Also cache ~/.konan, for the iOS jobs.
  cache-read-only:
    required: false
    default: 'false'
    description: Restore the cache without saving it; set it in workflows on main, where only warm-gradle-cache.yml saves.

outputs:
  cache-hit:
    description: Whether the dependency cache was restored from its primary key.
    value: ${{ steps.java.outputs.cache-hit }}
  build-cache-hit:
    description: Whether task outputs were restored for this exact commit.
    value: ${{ steps.build-cache.outputs.cache-hit }}
  build-cache-key:
    description: Key under which the warm workflow saves this commit's task outputs.
    value: ${{ steps.build-cache.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    # Runs before JDK 17 so JAVA_HOME stays 17; Gradle finds this daemon JDK locally and skips foojay.
    - name: Set up JetBrains JDK 21
      id: daemon-jdk
      uses: actions/setup-java@v6.0.1
      with:
        java-version: 21
        distribution: 'jetbrains'

    # The daemon JVM lookup ignores ~/.m2/toolchains.xml, so name the JDK path explicitly.
    - name: Point Gradle at the daemon JDK
      shell: bash
      run: |
        mkdir -p ~/.gradle
        echo "org.gradle.java.installations.paths=${{ steps.daemon-jdk.outputs.path }}" >> ~/.gradle/gradle.properties

    - name: Set up JDK 17
      id: java
      uses: actions/setup-java@v6.0.1
      with:
        java-version: 17
        distribution: 'zulu'
        cache: ${{ inputs.gradle-cache == 'true' && 'gradle' || '' }}
        # Cache each child separately so tar cannot include build-cache-1 through its parent.
        cache-path: |
          ~/.gradle/caches/*
          !~/.gradle/caches/build-cache-1
          ${{ inputs.kotlin-native == 'true' && '~/.konan' || '' }}
        cache-read-only: ${{ inputs.cache-read-only }}

    # Restore only: the warm workflow is the sole writer of task outputs on main.
    - name: Restore Gradle task outputs
      if: ${{ inputs.gradle-cache == 'true' }}
      id: build-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.gradle/caches/build-cache-1
        key: gradle-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
        restore-keys: |
          gradle-build-v1-${{ runner.os }}-${{ runner.arch }}-
