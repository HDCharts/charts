name: Publish GitHub prerelease with highlights
description: |
  Force-move a rolling tag to source-sha, then build release-note highlights from
  release-notes/<version> and publish a GitHub prerelease.

inputs:
  source-sha:
    description: Commit SHA to attach the release tag to.
    required: true
  version:
    description: Version whose release-notes/<version> directory is rendered as highlights.
    required: true

outputs:
  release-url:
    description: HTML URL of the published release.
    value: ${{ steps.publish.outputs.release-url }}

runs:
  using: composite
  steps:
    - name: Checkout source
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
        ref: ${{ inputs.source-sha }}
    - name: Build release highlights
      id: highlights
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        delimiter="HIGHLIGHTS_$(uuidgen | tr '[:upper:]' '[:lower:]')"
        {
          echo "body<<${delimiter}"
          bash scripts/build-release-body.sh "$VERSION" snapshot
          echo "${delimiter}"
        } >> "$GITHUB_OUTPUT"
    - name: Publish rolling release with highlights
      id: publish
      uses: actions/github-script@v9
      env:
        SOURCE_SHA: ${{ inputs.source-sha }}
        HIGHLIGHTS: ${{ steps.highlights.outputs.body }}
        VERSION: ${{ inputs.version }}
      with:
        script: |
          const { owner, repo } = context.repo;
          const sourceSha = process.env.SOURCE_SHA;
          const highlights = process.env.HIGHLIGHTS || '';
          const tag = 'snapshot';
          const name = `HDCharts ${process.env.VERSION}`;

          let refExists = false;
          try {
            await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            refExists = true;
          } catch (err) {
            if (err.status !== 404) throw err;
          }

          if (refExists) {
            await github.rest.git.updateRef({
              owner, repo, ref: `tags/${tag}`, sha: sourceSha, force: true,
            });
          } else {
            await github.rest.git.createRef({
              owner, repo, ref: `refs/tags/${tag}`, sha: sourceSha,
            });
          }

          let existing = null;
          try {
            existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
          } catch (err) {
            if (err.status !== 404) throw err;
          }

          const generated = await github.rest.repos.generateReleaseNotes({
            owner, repo, tag_name: tag,
          });

          const separator = '\n\n---\n\n';
          const autoNotes = generated.data.body || '';
          const body = highlights
            ? `${highlights}${separator}${autoNotes}`
            : autoNotes;

          const releaseParams = {
            owner, repo,
            tag_name: tag,
            target_commitish: sourceSha,
            name,
            draft: false,
            prerelease: true,
            body,
          };

          let release;
          if (existing) {
            release = await github.rest.repos.updateRelease({
              ...releaseParams,
              release_id: existing.data.id,
            });
          } else {
            release = await github.rest.repos.createRelease(releaseParams);
          }

          core.setOutput('release-url', release.data.html_url);
