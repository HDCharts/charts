# Workflow: assemble the Android app for a release version.
# It validates the selected version, decodes the signing keystore, and builds release APKs.
#
# This is the manual Android release build path.
name: Android Release Build
on:
  workflow_dispatch:
    inputs:
      allow_overwrite_release:
        description: "Allow overwrite of existing release APK"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: android-release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-release-build:
    name: Assemble Android App with Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.repository_owner == 'HDCharts' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu
          cache: gradle

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          release_version="$(bash .github/scripts/resolve-release-version.sh)"
          echo "version=${release_version}" >> "$GITHUB_OUTPUT"

      - name: Prepare Android signing
        uses: ./.github/actions/prepare-android-signing
        with:
          keystore-base64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          store-password: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}

      - name: Assemble androidApp release with release dependencies
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :androidApp:assembleRelease \
            -PchartsDependencyMode=release \
            -PchartsPublishedVersion=${{ steps.release.outputs.version }} \
            --no-daemon

      - name: Remove Android signing keystore
        if: always()
        shell: bash
        run: rm -f androidApp/release.keystore

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload APK to S3
        env:
          DOCS_STATIC_BUCKET: ${{ vars.DOCS_STATIC_BUCKET }}
          ALLOW_OVERWRITE: ${{ github.event.inputs.allow_overwrite_release }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${DOCS_STATIC_BUCKET:-}" ]]; then
            echo "Missing required repository variable: DOCS_STATIC_BUCKET" >&2
            exit 1
          fi

          apk_path="androidApp/build/outputs/apk/release/androidApp-release.apk"
          if [[ ! -f "${apk_path}" ]]; then
            echo "APK not found at: ${apk_path}" >&2
            exit 1
          fi

          bucket_uri="s3://${DOCS_STATIC_BUCKET}/static"
          s3_key="android/release/hdcharts-release.apk"

          # Guard against overwriting an existing release APK
          if [[ "${ALLOW_OVERWRITE}" != "true" ]]; then
            if aws s3api head-object --bucket "${DOCS_STATIC_BUCKET}" --key "static/${s3_key}" 2>/dev/null; then
              echo "Release APK already exists at ${bucket_uri}/${s3_key}" >&2
              echo "Set allow_overwrite_release=true to overwrite." >&2
              exit 1
            fi
          fi

          # Upload APK to S3
          aws s3 cp "${apk_path}" "${bucket_uri}/${s3_key}" \
            --content-type "application/vnd.android.package-archive" \
            --cache-control "public, max-age=31536000, immutable" \
            --only-show-errors

      - name: Publish run summary
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          DOCS_STATIC_BUCKET: ${{ vars.DOCS_STATIC_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          echo "### Android Release Build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release version: \`${RELEASE_VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gradle task: \`:androidApp:assembleRelease\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: \`s3://${DOCS_STATIC_BUCKET}/static/android/release/hdcharts-release.apk\`" >> "$GITHUB_STEP_SUMMARY"
