# Workflow: build the main charts project for pull requests and manual runs.
# Use this when you want a fast Gradle assemble check without running the full test suite.
#
# This is a lightweight CI gate for build validation.
name: Assemble
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    name: Assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'
          cache: gradle
      - name: Assemble
        run: ./gradlew ciAssemble
