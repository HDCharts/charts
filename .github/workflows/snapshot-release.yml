# Workflow: build and publish a snapshot release.
# It runs when recent code changes justify a snapshot publish.
#
# This is the automated pre-release path used between full releases.
name: Snapshot Release
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check for Changes
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect recent changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${{ github.actor }}" != "github-actions[bot]" ]; then
            echo "Manual workflow_dispatch run - proceeding regardless of recent changes."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(git log --since="24 hours ago" --name-only --pretty=format: | sort -u)
          if [ -z "${files:-}" ]; then
            echo "No commits in the last 24 hours."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          filtered=$(echo "$files" | grep -vE '(^docs/|\.md$)' || true)
          if [ -z "${filtered:-}" ]; then
            echo "Only ignored paths changed in the last 24 hours."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected in the last 24 hours:"
            echo "$filtered"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  snapshot-release:
    name: Publish Snapshot Release
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.repository_owner == 'HDCharts' && needs.changes.outputs.has_changes == 'true' }}
    outputs:
      snapshot_version: ${{ steps.version.outputs.snapshot_version }}
      is_snapshot: ${{ steps.version.outputs.is_snapshot }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'
          cache: gradle

      - name: Resolve snapshot version from Axion
        id: version
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT_VERSION=$(./gradlew -q currentVersion \
            | awk 'NF {v=$NF} END {gsub(/\r/, "", v); print v}')
          if [ -z "${SNAPSHOT_VERSION:-}" ]; then
            echo "Failed to resolve version from Axion currentVersion task." >&2
            exit 1
          fi

          # Check if version contains SNAPSHOT
          if [[ "$SNAPSHOT_VERSION" != *"-SNAPSHOT"* ]]; then
            echo "⏭️  Skipping snapshot release - version is not a SNAPSHOT: ${SNAPSHOT_VERSION}"
            echo "is_snapshot=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_snapshot=true" >> "$GITHUB_OUTPUT"
          fi

          echo "snapshot_version=${SNAPSHOT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Config chartsVersion: ${SNAPSHOT_VERSION}"

      - name: Prepare Maven publishing
        if: ${{ steps.version.outputs.is_snapshot == 'true' }}
        uses: ./.github/actions/prepare-maven-publishing
        with:
          maven-central-username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          maven-central-password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          signing-key-id: ${{ secrets.SIGNING_KEY_ID }}
          signing-password: ${{ secrets.SIGNING_PASSWORD }}
          signing-in-memory-key: ${{ secrets.SIGNING_IN_MEMORY_KEY }}

      - name: Publish snapshot to Maven Central
        if: ${{ steps.version.outputs.is_snapshot == 'true' }}
        run: |
          echo "Publishing snapshot version: ${{ steps.version.outputs.snapshot_version }}"
          ./gradlew publishChartsModules --no-daemon --stacktrace

      - name: Comment on commit
        if: ${{ steps.version.outputs.is_snapshot == 'true' }}
        uses: actions/github-script@v9
        with:
          script: |
            const version = '${{ steps.version.outputs.snapshot_version }}';
            const message = [
              '🚀 **Snapshot Release Published**',
              '',
              `Version: \`${version}\``,
              '',
              'The snapshot is now available on Maven Central Snapshots repository.',
              '',
              'https://central.sonatype.com/repository/maven-snapshots/io/github/dautovicharis/charts/maven-metadata.xml',
              '',
              'Umbrella artifact:',
              '```kotlin',
              `implementation("io.github.dautovicharis:charts:${version}")`,
              '```',
              '',
              'Modular artifacts:',
              '```kotlin',
              `implementation("io.github.dautovicharis:charts-core:${version}")`,
              `implementation("io.github.dautovicharis:charts-line:${version}")`,
              `implementation("io.github.dautovicharis:charts-pie:${version}")`,
              `implementation("io.github.dautovicharis:charts-bar:${version}")`,
              `implementation("io.github.dautovicharis:charts-stacked-bar:${version}")`,
              `implementation("io.github.dautovicharis:charts-stacked-area:${version}")`,
              `implementation("io.github.dautovicharis:charts-radar:${version}")`,
              '```',
              '',
              'BOM alignment (for Gradle platforms):',
              '```kotlin',
              `implementation(platform("io.github.dautovicharis:charts-bom:${version}"))`,
              'implementation("io.github.dautovicharis:charts-core")',
              'implementation("io.github.dautovicharis:charts-line")',
              'implementation("io.github.dautovicharis:charts-pie")',
              'implementation("io.github.dautovicharis:charts-bar")',
              'implementation("io.github.dautovicharis:charts-stacked-bar")',
              'implementation("io.github.dautovicharis:charts-stacked-area")',
              'implementation("io.github.dautovicharis:charts-radar")',
              '```',
            ].join('\n');

            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: message
            })

  trigger-android-build:
    name: Trigger Android Snapshot Build
    runs-on: ubuntu-latest
    needs: snapshot-release
    if: ${{ needs.snapshot-release.outputs.is_snapshot == 'true' }}
    steps:
      - name: Trigger Android Snapshot Build workflow
        uses: actions/github-script@v9
        with:
          script: |
            const workflowId = 'android-snapshot-build.yml';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: workflowId,
              ref: context.ref,
            });
            
            console.log(`Triggered ${workflowId} with version ${{ needs.snapshot-release.outputs.snapshot_version }}`);

      - name: Publish run summary
        run: |
          echo "### Android Snapshot Build Triggered" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`${{ needs.snapshot-release.outputs.snapshot_version }}\`" >> "$GITHUB_STEP_SUMMARY"
