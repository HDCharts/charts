# Coordinates Maven, static docs assets, and Android builds for one snapshot.
# It runs when recent code changes justify a snapshot publish.
name: Snapshot Release
on:
  workflow_call:
    secrets:
      AWS_ROLE_ARN:
        required: true
      CHARTS_WORKFLOW_TOKEN:
        required: true
      MAVEN_CENTRAL_USERNAME:
        required: true
      MAVEN_CENTRAL_PASSWORD:
        required: true
      SIGNING_KEY_ID:
        required: true
      SIGNING_PASSWORD:
        required: true
      SIGNING_IN_MEMORY_KEY:
        required: true
      ANDROID_RELEASE_KEYSTORE_BASE64:
        required: true
      ANDROID_RELEASE_STORE_PASSWORD:
        required: true
      ANDROID_RELEASE_KEY_ALIAS:
        required: true
      ANDROID_RELEASE_KEY_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      reason:
        description: Optional note for the manual snapshot run.
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check for Changes
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect recent changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Manual snapshot run requested."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(git log --since="24 hours ago" --name-only --pretty=format: | sort -u)
          if [ -z "${files:-}" ]; then
            echo "No commits in the last 24 hours."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          filtered="$({
            while IFS= read -r file; do
              case "${file}" in
                release-notes/*) printf '%s\n' "${file}" ;;
                docs/*|*.md) ;;
                *) printf '%s\n' "${file}" ;;
              esac
            done <<< "${files}"
          } | sort -u)"
          if [ -z "${filtered:-}" ]; then
            echo "Only ignored paths changed in the last 24 hours."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected in the last 24 hours:"
            echo "$filtered"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  prepare-snapshot:
    name: Prepare Snapshot Release
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.has_changes == 'true' }}
    environment: Snapshot
    outputs:
      snapshot_version: ${{ steps.version.outputs.snapshot_version }}
      release_notes_version: ${{ steps.version.outputs.release_notes_version }}
      is_snapshot: ${{ steps.version.outputs.is_snapshot }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: 17
          distribution: 'zulu'
          cache: gradle

      - name: Resolve snapshot version from Axion
        id: version
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT_VERSION=$(./gradlew -q currentVersion \
            | awk 'NF {v=$NF} END {gsub(/\r/, "", v); print v}')
          if [ -z "${SNAPSHOT_VERSION:-}" ]; then
            echo "Failed to resolve version from Axion currentVersion task." >&2
            exit 1
          fi

          # Check if version contains SNAPSHOT
          if [[ "$SNAPSHOT_VERSION" != *"-SNAPSHOT"* ]]; then
            echo "⏭️  Skipping snapshot release - version is not a SNAPSHOT: ${SNAPSHOT_VERSION}"
            echo "is_snapshot=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_snapshot=true" >> "$GITHUB_OUTPUT"
          fi

          echo "snapshot_version=${SNAPSHOT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_notes_version=${SNAPSHOT_VERSION%-SNAPSHOT}" >> "$GITHUB_OUTPUT"
          echo "Config chartsVersion: ${SNAPSHOT_VERSION}"

      - name: Record immutable snapshot source
        id: source
        shell: bash
        run: echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate charts-docs workflow token
        if: ${{ steps.version.outputs.is_snapshot == 'true' }}
        env:
          CHARTS_WORKFLOW_TOKEN: ${{ secrets.CHARTS_WORKFLOW_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${CHARTS_WORKFLOW_TOKEN:-}" ]]; then
            echo "Missing CHARTS_WORKFLOW_TOKEN. It must be a release-bot token with contents:write and ruleset-bypass access to HDCharts/charts-docs main." >&2
            exit 1
          fi

  sync-release-notes:
    name: Sync snapshot release notes and GIF baselines
    needs: prepare-snapshot
    if: ${{ needs.prepare-snapshot.outputs.is_snapshot == 'true' }}
    runs-on: ubuntu-latest
    environment: Snapshot
    steps:
      - name: Checkout snapshot source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ needs.prepare-snapshot.outputs.source_sha }}
      - name: Checkout charts-docs main
        uses: actions/checkout@v7
        with:
          repository: HDCharts/charts-docs
          ref: main
          path: charts-docs-repo
          fetch-depth: 0
          token: ${{ secrets.CHARTS_WORKFLOW_TOKEN }}
      - name: Mirror snapshot release notes
        env:
          ALLOW_MISSING_RELEASE_NOTES: "true"
        run: bash .github/scripts/sync-release-notes.sh charts-docs-repo "${{ needs.prepare-snapshot.outputs.release_notes_version }}"
      - name: Sync snapshot GIF baselines
        run: bash .github/scripts/sync-gif-baselines.sh charts-docs-repo
      - name: Write snapshot provenance
        env:
          SNAPSHOT_VERSION: ${{ needs.prepare-snapshot.outputs.snapshot_version }}
          SOURCE_SHA: ${{ needs.prepare-snapshot.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p charts-docs-repo/docs-app/public
          printf '{"source_sha":"%s","charts_version":"%s"}\n' \
            "$SOURCE_SHA" "$SNAPSHOT_VERSION" \
            > charts-docs-repo/docs-app/public/snapshot-manifest.json
      - name: Commit and push charts-docs main
        working-directory: charts-docs-repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "charts-release-bot"
          git config user.email "charts-release-bot@users.noreply.github.com"
          git add release-notes content/snapshot/wiki/assets docs-app/public/snapshot-manifest.json
          if git diff --cached --quiet; then
            echo "Snapshot release notes, GIF baselines, and provenance are already current."
          else
            git commit -m "docs(snapshot): sync release notes, GIF baselines, and provenance"
            git push origin HEAD:main
          fi

  publish-static-assets:
    name: Publish snapshot API reference and demo
    needs: [prepare-snapshot, sync-release-notes]
    if: ${{ needs.prepare-snapshot.outputs.is_snapshot == 'true' }}
    uses: ./.github/workflows/publish-static-assets.yml
    with:
      mode: snapshot
      charts-version: ${{ needs.prepare-snapshot.outputs.snapshot_version }}
      source-sha: ${{ needs.prepare-snapshot.outputs.source_sha }}
      source-ref: ${{ needs.prepare-snapshot.outputs.source_sha }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

  publish-maven:
    name: Publish Snapshot to Maven Central
    needs: [prepare-snapshot, publish-static-assets]
    if: ${{ needs.prepare-snapshot.outputs.is_snapshot == 'true' }}
    runs-on: ubuntu-latest
    environment: Snapshot
    steps:
      - name: Checkout snapshot source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-snapshot.outputs.source_sha }}
      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: 17
          distribution: zulu
          cache: gradle

      - name: Publish snapshot to Maven Central
        uses: ./.github/actions/publish-charts-modules
        with:
          maven-central-username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          maven-central-password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          signing-key-id: ${{ secrets.SIGNING_KEY_ID }}
          signing-password: ${{ secrets.SIGNING_PASSWORD }}
          signing-in-memory-key: ${{ secrets.SIGNING_IN_MEMORY_KEY }}

  announce-snapshot:
    name: Announce Snapshot Release
    needs: [prepare-snapshot, publish-static-assets, publish-maven]
    if: ${{ needs.prepare-snapshot.outputs.is_snapshot == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Publish GitHub prerelease with highlights
        id: publish
        uses: ./.github/actions/publish-github-prerelease
        with:
          source-sha: ${{ needs.prepare-snapshot.outputs.source_sha }}
          version: ${{ needs.prepare-snapshot.outputs.release_notes_version }}
      - name: Comment on commit
        uses: actions/github-script@v9
        env:
          SNAPSHOT_VERSION: ${{ needs.prepare-snapshot.outputs.snapshot_version }}
          RELEASE_URL: ${{ steps.publish.outputs.release-url }}
        with:
          script: |
            const version = process.env.SNAPSHOT_VERSION;
            const releaseUrl = process.env.RELEASE_URL;

            const message = [
              '🚀 **Snapshot Release Published**',
              '',
              `Version: \`${version}\``,
              '',
              'The snapshot is now available on Maven Central Snapshots repository.',
              '',
              'https://central.sonatype.com/repository/maven-snapshots/io/github/dautovicharis/charts/maven-metadata.xml',
              '',
              'Umbrella artifact:',
              '```kotlin',
              `implementation("io.github.dautovicharis:charts:${version}")`,
              '```',
              '',
              'Modular artifacts:',
              '```kotlin',
              `implementation("io.github.dautovicharis:charts-core:${version}")`,
              `implementation("io.github.dautovicharis:charts-line:${version}")`,
              `implementation("io.github.dautovicharis:charts-pie:${version}")`,
              `implementation("io.github.dautovicharis:charts-bar:${version}")`,
              `implementation("io.github.dautovicharis:charts-stacked-bar:${version}")`,
              `implementation("io.github.dautovicharis:charts-stacked-area:${version}")`,
              `implementation("io.github.dautovicharis:charts-radar:${version}")`,
              '```',
              '',
              'BOM alignment (for Gradle platforms):',
              '```kotlin',
              `implementation(platform("io.github.dautovicharis:charts-bom:${version}"))`,
              'implementation("io.github.dautovicharis:charts-core")',
              'implementation("io.github.dautovicharis:charts-line")',
              'implementation("io.github.dautovicharis:charts-pie")',
              'implementation("io.github.dautovicharis:charts-bar")',
              'implementation("io.github.dautovicharis:charts-stacked-bar")',
              'implementation("io.github.dautovicharis:charts-stacked-area")',
              'implementation("io.github.dautovicharis:charts-radar")',
              '```',
            ].join('\n');

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `${message}\n\n🔗 [GitHub Pre-Release](${releaseUrl})`,
            });

  build-android:
    name: Build Android Snapshot
    needs: [prepare-snapshot, publish-static-assets, publish-maven]
    if: ${{ needs.prepare-snapshot.outputs.is_snapshot == 'true' }}
    uses: ./.github/workflows/android-build.yml
    with:
      channel: snapshot
      source-sha: ${{ needs.prepare-snapshot.outputs.source_sha }}
      published-version: ${{ needs.prepare-snapshot.outputs.snapshot_version }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
