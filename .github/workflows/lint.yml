# Reusable Kotlin lint check for pull request orchestration.
name: Lint

on:
  workflow_call:
    inputs:
      should-run:
        description: Whether the pull request contains code or build changes.
        required: true
        type: boolean
      source-sha:
        description: Immutable merge revision being checked.
        required: true
        type: string

permissions:
  contents: read

jobs:
  skipped:
    name: Docs-only no-op
    if: ${{ !inputs.should-run }}
    runs-on: ubuntu-latest
    steps:
      - name: Report docs-only no-op
        run: echo 'No code changes require the lint check.'

  lint:
    name: Lint
    if: ${{ inputs.should-run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source-sha }}
      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          java-version: 17
          distribution: 'zulu'
          cache: gradle
      - name: Lint
        run: ./gradlew ktlintCheck buildSrcKtlintCheck
