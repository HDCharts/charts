# Workflow: dispatch charts-docs to promote snapshot docs into a release version.
# This is the cross-repo handoff that turns snapshot docs into release docs.
#
# It only runs from the charts repo to trigger docs promotion downstream.
name: Promote Docs
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promote-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promote-docs:
    name: Resolve version and dispatch charts-docs promotion
    runs-on: ubuntu-latest
    if: >
      github.repository_owner == 'HDCharts' &&
      github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "zulu"
          cache: gradle

      - name: Resolve release version from Axion
        id: version
        shell: bash
        run: |
          set -euo pipefail
          release_version="$(bash .github/scripts/resolve-release-version.sh)"
          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"
          echo "Resolved docs release version: ${release_version}"

      - name: Validate charts-docs workflow token
        shell: bash
        env:
          CHARTS_WORKFLOW_TOKEN: ${{ secrets.CHARTS_WORKFLOW_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CHARTS_WORKFLOW_TOKEN:-}" ]]; then
            echo "Missing required secret: CHARTS_WORKFLOW_TOKEN." >&2
            echo "Cross-repo workflow dispatch to HDCharts/charts-docs cannot use GITHUB_TOKEN." >&2
            exit 1
          fi

      - name: Dispatch charts-docs promote workflow
        uses: actions/github-script@v9
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        with:
          github-token: ${{ secrets.CHARTS_WORKFLOW_TOKEN }}
          script: |
            const releaseVersion = process.env.RELEASE_VERSION;
            const sourceRunUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createDispatchEvent({
              owner: 'HDCharts',
              repo: 'charts-docs',
              event_type: 'promote-docs',
              client_payload: {
                release_version: releaseVersion,
                source_repository: `${context.repo.owner}/${context.repo.repo}`,
                source_sha: context.sha,
                source_run_url: sourceRunUrl,
              },
            });
            core.info(`Dispatched charts-docs promotion for ${releaseVersion}`);
