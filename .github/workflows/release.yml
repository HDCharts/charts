name: Recover 3.0.0 release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: recover-release-3.0.0
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Verify published release source
    if: github.ref == 'refs/heads/recovery/release-3.0.0'
    runs-on: ubuntu-26.04
    outputs:
      release_version: '3.0.0'
      source_sha: '60864f821601ef8b12afe84586638553ce8f8090'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: 60864f821601ef8b12afe84586638553ce8f8090
      - name: Verify source and published chart artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 60864f821601ef8b12afe84586638553ce8f8090
          python3 - <<'CHECK'
          import re
          import urllib.request
          from pathlib import Path
          source = Path('buildSrc/src/main/kotlin/Config.kt').read_text()
          artifacts = re.findall(r'const val ARTIFACT(?:_\w+)?_ID = "([^"]+)"', source)
          assert len(artifacts) == 11, artifacts
          for artifact in artifacts:
              url = f'https://repo.maven.apache.org/maven2/io/github/hdcharts/{artifact}/3.0.0/{artifact}-3.0.0.pom'
              with urllib.request.urlopen(url, timeout=30) as response:
                  assert response.status == 200
              print(f'Published: io.github.hdcharts:{artifact}:3.0.0')
          CHECK

  publish-maven:
    name: Publish missing relocation POMs and tag
    needs: prepare-release
    timeout-minutes: 80
    runs-on: ubuntu-26.04
    environment: Production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.source_sha }}
      - uses: ./.github/actions/setup-jdk
        with:
          gradle-cache: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Verify published API and demo assets
        uses: ./.github/actions/validate-docs-static-release
        with:
          release-version: ${{ needs.prepare-release.outputs.release_version }}
          source-sha: ${{ needs.prepare-release.outputs.source_sha }}
          docs-static-bucket: ${{ vars.DOCS_STATIC_BUCKET }}
      - name: Check relocation publication state
        id: relocation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'CHECK'
          import os
          import re
          import urllib.error
          import urllib.request
          from pathlib import Path
          source = Path('buildSrc/src/main/kotlin/Config.kt').read_text()
          artifacts = re.findall(r'const val ARTIFACT(?:_\w+)?_ID = "([^"]+)"', source)
          artifacts.remove('gauge')
          published = []
          for artifact in artifacts:
              url = f'https://repo.maven.apache.org/maven2/io/github/dautovicharis/{artifact}/3.0.0/{artifact}-3.0.0.pom'
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      published.append(artifact)
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
          if published and len(published) != len(artifacts):
              raise SystemExit(f'Partial relocation publication; refusing duplicate upload: {published}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'publish={str(not published).lower()}\n')
          print(f'{len(published)}/{len(artifacts)} relocation POMs already published')
          CHECK
      - name: Prepare and validate relocation POM metadata
        if: steps.relocation.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'CHECK'
          import re
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path('charts-relocation/build.gradle.kts')
          source = path.read_text()
          needle = '                pom {\n                    packaging = "pom"'
          replacement = '                pom {\n                    ChartsPublishing.configurePom(\n                        pom = this,\n                        moduleName = "HDCharts $artifactId relocation",\n                        moduleDescription = "Relocation to $relocationNewGroupId:$artifactId.",\n                    )\n                    packaging = "pom"'
          assert source.count(needle) == 1
          path.write_text(source.replace(needle, replacement))
          artifacts = re.findall(r'const val ARTIFACT(?:_\w+)?_ID = "([^"]+)"', Path('buildSrc/src/main/kotlin/Config.kt').read_text())
          artifacts.remove('gauge')
          tasks = [f':charts-relocation:generatePomFileForRelocation-{artifact}Publication' for artifact in artifacts]
          subprocess.run(['./gradlew', *tasks, '-PchartsReleaseVersion=3.0.0', '--no-daemon', '--stacktrace'], check=True)
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          required = ['name', 'description', 'url', 'licenses/license/name', 'licenses/license/url', 'developers/developer/id', 'developers/developer/name', 'scm/url', 'scm/connection']
          for artifact in artifacts:
              pom = Path(f'charts-relocation/build/publications/relocation-{artifact}/pom-default.xml')
              root = ET.parse(pom).getroot()
              def value(path):
                  return root.findtext('/'.join('m:' + part for part in path.split('/')), namespaces=ns)
              for field in required:
                  assert value(field), (artifact, field)
              assert value('groupId') == 'io.github.dautovicharis'
              assert value('artifactId') == artifact
              assert value('version') == '3.0.0'
              assert value('packaging') == 'pom'
              assert value('distributionManagement/relocation/groupId') == 'io.github.hdcharts'
              assert value('distributionManagement/relocation/artifactId') == artifact
              assert value('distributionManagement/relocation/version') == '3.0.0'
              print(f'Validated complete relocation POM: {artifact}', flush=True)
          CHECK
      - name: Prepare Maven publishing
        if: steps.relocation.outputs.publish == 'true'
        uses: ./.github/actions/prepare-maven-publishing
        with:
          maven-central-username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          maven-central-password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          signing-key-id: ${{ secrets.SIGNING_KEY_ID }}
          signing-password: ${{ secrets.SIGNING_PASSWORD }}
          signing-in-memory-key: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
      - name: Publish only relocation POMs
        if: steps.relocation.outputs.publish == 'true'
        shell: bash
        run: |
          ./gradlew :charts-relocation:publish -PchartsReleaseVersion=3.0.0 \
            -PSONATYPE_CLOSE_TIMEOUT_SECONDS=3600 \
            --no-build-cache --no-daemon --stacktrace
      - name: Verify relocation POMs are publicly available
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'CHECK'
          import re
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path
          source = Path('buildSrc/src/main/kotlin/Config.kt').read_text()
          pending = set(re.findall(r'const val ARTIFACT(?:_\w+)?_ID = "([^"]+)"', source)) - {'gauge'}
          deadline = time.monotonic() + 1200
          while pending:
              for artifact in list(pending):
                  url = f'https://repo.maven.apache.org/maven2/io/github/dautovicharis/{artifact}/3.0.0/{artifact}-3.0.0.pom'
                  try:
                      with urllib.request.urlopen(url, timeout=30) as response:
                          response.read()
                      pending.remove(artifact)
                      print(f'Published relocation: {artifact}', flush=True)
                  except urllib.error.HTTPError as error:
                      if error.code != 404:
                          raise
              if pending:
                  if time.monotonic() >= deadline:
                      raise SystemExit(f'Relocation availability timed out: {sorted(pending)}')
                  print(f'Waiting for {len(pending)} relocation POMs', flush=True)
                  time.sleep(20)
          CHECK
      - name: Push release tag at the published source
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse -q --verify refs/tags/3.0.0 >/dev/null; then
            test "$(git rev-parse 'refs/tags/3.0.0^{commit}')" = 60864f821601ef8b12afe84586638553ce8f8090
          else
            git tag 3.0.0 60864f821601ef8b12afe84586638553ce8f8090
            git push origin refs/tags/3.0.0
          fi

  build-android:
    name: Build Android Release
    needs: [prepare-release, publish-maven]
    uses: ./.github/workflows/android-build.yml
    with:
      channel: release
      source-sha: ${{ needs.prepare-release.outputs.source_sha }}
      published-version: ${{ needs.prepare-release.outputs.release_version }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}

  promote-docs:
    name: Sync notes and promote docs on main
    needs: [prepare-release, publish-maven, build-android]
    runs-on: ubuntu-26.04
    environment: Production
    outputs:
      docs_sha: ${{ steps.push.outputs.docs_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ needs.prepare-release.outputs.source_sha }}
      - name: Validate charts-docs release bot token
        env:
          CHARTS_WORKFLOW_TOKEN: ${{ secrets.CHARTS_WORKFLOW_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CHARTS_WORKFLOW_TOKEN:-}" ]]; then
            echo "Missing CHARTS_WORKFLOW_TOKEN. It must be a release-bot token with contents:write and ruleset-bypass access to HDCharts/charts-docs main." >&2
            exit 1
          fi
      - name: Checkout charts-docs main
        uses: actions/checkout@v7
        with:
          repository: HDCharts/charts-docs
          ref: main
          path: charts-docs-repo
          fetch-depth: 0
          token: ${{ secrets.CHARTS_WORKFLOW_TOKEN }}
      - name: Sync release notes and promote version
        run: bash .github/scripts/promote-release-docs.sh charts-docs-repo "${{ needs.prepare-release.outputs.release_version }}" "${{ needs.prepare-release.outputs.source_sha }}"
      - name: Commit and push charts-docs main
        id: push
        working-directory: charts-docs-repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "charts-release-bot"
          git config user.email "charts-release-bot@users.noreply.github.com"
          git add content registry release-notes docs-app/public/release-manifest.json
          if git diff --cached --quiet; then
            echo "No charts-docs changes required."
          else
            git commit -m "chore(release): publish ${{ needs.prepare-release.outputs.release_version }}"
            git push origin HEAD:main
          fi
          echo "docs_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify-docs-deployment:
    name: Verify public docs deployment
    needs: [prepare-release, promote-docs]
    runs-on: ubuntu-26.04
    steps:
      - name: Wait for the deployment manifest and public routes
        env:
          DOCS_APP_URL: ${{ vars.DOCS_APP_URL }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
          CHARTS_SHA: ${{ needs.prepare-release.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${DOCS_APP_URL:-}" ]] || { echo "Missing required repository variable: DOCS_APP_URL" >&2; exit 1; }
          base_url="${DOCS_APP_URL%/}"
          deadline=$((SECONDS + 1200))
          while (( SECONDS < deadline )); do
            manifest="$(curl --fail --silent --show-error --max-time 20 "${base_url}/release-manifest.json?release=${RELEASE_VERSION}&attempt=${SECONDS}" || true)"
            if jq -e \
              --arg version "$RELEASE_VERSION" --arg sha "$CHARTS_SHA" \
              '.charts_version == $version and .source_sha == $sha' <<<"${manifest}" >/dev/null 2>&1 \
              && curl --fail --silent --show-error --max-time 20 "${base_url}/${RELEASE_VERSION}/wiki" >/dev/null \
              && curl --fail --silent --show-error --max-time 20 "${base_url}/${RELEASE_VERSION}/api" >/dev/null \
              && curl --fail --silent --show-error --max-time 20 "${base_url}/demo/${RELEASE_VERSION}/" >/dev/null; then
              echo "Verified docs deployment for ${RELEASE_VERSION}."
              exit 0
            fi
            sleep 20
          done
          echo "Timed out waiting for docs deployment of ${RELEASE_VERSION}." >&2
          exit 1

  announce-release:
    name: Announce release
    needs: [prepare-release, publish-maven, promote-docs, verify-docs-deployment]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Publish GitHub release with highlights
        id: publish
        uses: ./.github/actions/publish-github-release
        with:
          source-sha: ${{ needs.prepare-release.outputs.source_sha }}
          version: ${{ needs.prepare-release.outputs.release_version }}
