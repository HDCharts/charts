# Reusable charts test suite for pull request orchestration.
name: Test

on:
  workflow_call:
    inputs:
      should-run:
        description: Whether the pull request contains code or build changes.
        required: true
        type: boolean
      source-sha:
        description: Immutable merge revision being checked.
        required: true
        type: string

permissions:
  contents: read

jobs:
  skipped:
    name: Docs-only no-op
    if: ${{ !inputs.should-run }}
    runs-on: ubuntu-26.04
    steps:
      - name: Report docs-only no-op
        run: echo 'No code changes require the test suite.'

  jvm-tests:
    name: JVM Tests
    if: ${{ inputs.should-run }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ inputs.source-sha }}

      - name: Set up JDK 17
        uses: ./.github/actions/setup-jdk

      - name: Run JVM tests
        run: ./gradlew ciTestJvm --no-daemon

      - name: Upload JVM test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: jvm-test-reports
          if-no-files-found: warn
          path: |
            **/build/reports/tests/**
            **/build/test-results/**

  android-instrumented-tests:
    name: Android Instrumented Tests ${{ matrix.shard }}/2
    if: ${{ inputs.should-run }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ inputs.source-sha }}

      - name: Set up JDK 17
        uses: ./.github/actions/setup-jdk

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", MODE="0666", GROUP="kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: Nexus 6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: adb shell setprop debug.hwui.drawing_enabled 1 && adb shell wm density 280 && ./gradlew ciTestAndroidInstrumented -PandroidTestShard=${{ matrix.shard }} --no-daemon

      - name: Upload Android instrumented test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-instrumented-test-reports-${{ matrix.shard }}
          if-no-files-found: warn
          path: |
            **/build/reports/androidTests/connected/**
            **/build/outputs/androidTest-results/connected/**

  screenshot-tests:
    name: Screenshot Tests
    if: ${{ inputs.should-run }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ inputs.source-sha }}

      - name: Set up JDK 17
        uses: ./.github/actions/setup-jdk

      - name: Run screenshot tests
        run: ./gradlew ciTestScreenshot --no-daemon

      - name: Upload screenshot test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-test-reports
          if-no-files-found: warn
          path: |
            sample/androidApp/build/reports/screenshotTest/**
            sample/androidApp/build/test-results/validateDebugScreenshotTest/**

  web-tests:
    name: Wasm Tests
    if: ${{ inputs.should-run }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ inputs.source-sha }}

      - name: Set up JDK 17
        uses: ./.github/actions/setup-jdk

      - name: Run Wasm tests
        run: ./gradlew ciTestWeb --no-daemon

      - name: Upload Wasm test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: wasm-test-reports
          if-no-files-found: warn
          path: |
            **/build/reports/tests/**
            **/build/test-results/**

  ios-tests:
    name: iOS Tests
    if: ${{ inputs.should-run }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ inputs.source-sha }}

      - name: Set up JDK 17
        uses: ./.github/actions/setup-jdk
        with:
          kotlin-native: true

      - name: Run iOS tests
        run: ./gradlew ciTestIos --no-daemon

      - name: Upload iOS test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-reports
          if-no-files-found: warn
          path: |
            **/build/reports/iosSimulatorArm64Test/**
            **/build/test-results/iosSimulatorArm64Test/**
