# Reusable charts test suite for pull request orchestration.
name: Test

on:
  workflow_call:
    inputs:
      should-run:
        description: Whether the pull request contains code or build changes.
        required: true
        type: boolean
      source-sha:
        description: Immutable merge revision being checked.
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source-sha }}
      - name: Set up JDK 17
        if: ${{ inputs.should-run }}
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'zulu'
          cache: gradle
      - name: Test
        if: ${{ inputs.should-run }}
        run: ./gradlew chartsTest
      - name: Upload Gradle test reports
        if: ${{ always() && inputs.should-run }}
        uses: actions/upload-artifact@v7
        with:
          name: gradle-test-reports
          if-no-files-found: warn
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
      - name: Skip tests for docs-only changes
        if: ${{ !inputs.should-run }}
        run: echo "No code/build changes detected. Skipping tests."
