# Reusable publication of the static API reference, demo, and snapshot
# playground. Releases and
# snapshots share the mechanics but retain separate callers and policies.
name: Publish Static Assets

on:
  workflow_call:
    inputs:
      mode:
        description: Release channel to publish.
        required: true
        type: string
      charts-version:
        description: Version recorded in the publication metadata.
        required: true
        type: string
      source-sha:
        description: Charts commit represented by this publication.
        required: true
        type: string
      source-ref:
        description: Git ref to build and publish.
        required: true
        type: string
      replace-static-assets:
        description: Replace existing static assets for an unreleased version.
        required: false
        type: boolean
        default: false
    secrets:
      AWS_ROLE_ARN:
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: static-assets-${{ inputs.mode }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-api-reference:
    name: Publish API reference
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.mode == 'release' && 'Production' || 'Snapshot' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source-ref }}
      - uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: zulu
          cache: gradle
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Build API reference
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew generateApiDocs -PchartsReleaseVersion="${{ inputs.charts-version }}" --no-daemon --stacktrace --build-cache
      - name: Validate API reference
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.mode }}" == "release" ]]; then
            asset_dir="docs/static/api/${{ inputs.charts-version }}"
          else
            asset_dir="docs/static/api/snapshot"
          fi
          [[ -f "${asset_dir}/index.html" ]] || {
            echo "Missing generated API reference: ${asset_dir}/index.html" >&2
            exit 1
          }
      - name: Publish API reference
        env:
          CURRENT_VERSION: ${{ inputs.charts-version }}
          CHARTS_VERSION: ${{ inputs.charts-version }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          DOCS_STATIC_BUCKET: ${{ vars.DOCS_STATIC_BUCKET }}
          REPLACE_STATIC_ASSETS: ${{ inputs.replace-static-assets }}
        shell: bash
        run: bash .github/scripts/publish-docs-to-s3.sh "${{ inputs.mode }}" api

  publish-demo:
    name: Publish demo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.mode == 'release' && 'Production' || 'Snapshot' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source-ref }}
      - uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: zulu
          cache: gradle
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Build demo
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew generateJsDemo -PchartsReleaseVersion="${{ inputs.charts-version }}" --no-daemon --stacktrace --build-cache
      - name: Validate demo
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.mode }}" == "release" ]]; then
            asset_dir="docs/static/demo/${{ inputs.charts-version }}"
          else
            asset_dir="docs/static/demo/snapshot"
          fi
          [[ -f "${asset_dir}/index.html" ]] || {
            echo "Missing generated demo: ${asset_dir}/index.html" >&2
            exit 1
          }
      - name: Publish demo
        env:
          CURRENT_VERSION: ${{ inputs.charts-version }}
          CHARTS_VERSION: ${{ inputs.charts-version }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          DOCS_STATIC_BUCKET: ${{ vars.DOCS_STATIC_BUCKET }}
          REPLACE_STATIC_ASSETS: ${{ inputs.replace-static-assets }}
        shell: bash
        run: bash .github/scripts/publish-docs-to-s3.sh "${{ inputs.mode }}" demo

  publish-playground:
    name: Publish playground
    if: ${{ inputs.mode == 'snapshot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Snapshot
    steps:
      - name: Checkout charts source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ inputs.source-ref }}
      - name: Checkout charts-playground
        uses: actions/checkout@v7
        with:
          repository: HDCharts/charts-playground
          ref: main
          path: playground-repo
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: zulu
          cache: gradle
      - name: Build playground static assets
        working-directory: playground-repo
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew -DchartsLocalPath=.. :playground:jsBrowserDevelopmentExecutableDistribution \
            --no-daemon --stacktrace --build-cache
      - name: Validate playground static assets
        working-directory: playground-repo
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            playground/build/dist/js/developmentExecutable/index.html
            playground/build/dist/js/developmentExecutable/Playground.js
          )
          for file in "${required_files[@]}"; do
            if [[ ! -f "${file}" ]]; then
              echo "Missing required playground file: ${file}" >&2
              exit 1
            fi
          done
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Publish playground snapshot
        working-directory: playground-repo
        env:
          CHARTS_VERSION: ${{ inputs.charts-version }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          DOCS_STATIC_BUCKET: ${{ vars.DOCS_STATIC_BUCKET }}
          PLAYGROUND_DIST_DIR: playground/build/dist/js/developmentExecutable
        shell: bash
        run: bash ../.github/scripts/publish-docs-to-s3.sh snapshot playground

  publish-shared-static-assets:
    name: Publish shared static assets
    runs-on: ubuntu-latest
    needs: [publish-api-reference, publish-demo, publish-playground]
    if: >-
      ${{
        always() &&
        needs.publish-api-reference.result == 'success' &&
        needs.publish-demo.result == 'success' &&
        (needs.publish-playground.result == 'success' || needs.publish-playground.result == 'skipped')
      }}
    environment: ${{ inputs.mode == 'release' && 'Production' || 'Snapshot' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Publish shared static assets
        env:
          CURRENT_VERSION: ${{ inputs.charts-version }}
          CHARTS_VERSION: ${{ inputs.charts-version }}
          DOCS_STATIC_BUCKET: ${{ vars.DOCS_STATIC_BUCKET }}
        shell: bash
        run: bash .github/scripts/publish-docs-to-s3.sh "${{ inputs.mode }}" shared

  finalize-publication:
    name: Finalize static publication
    runs-on: ubuntu-latest
    needs: publish-shared-static-assets
    if: >-
      ${{
        always() &&
        needs.publish-shared-static-assets.result == 'success'
      }}
    environment: ${{ inputs.mode == 'release' && 'Production' || 'Snapshot' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Write publication metadata
        env:
          CURRENT_VERSION: ${{ inputs.charts-version }}
          CHARTS_VERSION: ${{ inputs.charts-version }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          DOCS_STATIC_BUCKET: ${{ vars.DOCS_STATIC_BUCKET }}
        shell: bash
        run: bash .github/scripts/publish-docs-to-s3.sh "${{ inputs.mode }}" metadata
      - name: Invalidate CloudFront cache
        env:
          CURRENT_VERSION: ${{ inputs.charts-version }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        shell: bash
        run: bash .github/scripts/invalidate-docs-cloudfront.sh "${{ inputs.mode }}"
