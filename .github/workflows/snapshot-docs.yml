# Manually sync release notes, wiki docs, and GIF baselines into charts-docs main
# without running the full Snapshot Release pipeline (Maven publish, API reference
# build, Android build). Use this when only docs content changed.
name: Snapshot Docs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve source and release-notes version
    runs-on: ubuntu-26.04
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      release_notes_version: ${{ steps.resolve.outputs.release_notes_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          java-version: 17
          distribution: zulu
          cache: gradle
      - name: Resolve source and release-notes version
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          VERSION=$(./gradlew -q currentVersion | awk 'NF {v=$NF} END {gsub(/\r/, "", v); print v}')
          if [ -z "${VERSION:-}" ]; then
            echo "Failed to resolve version from Axion currentVersion task." >&2
            exit 1
          fi
          echo "release_notes_version=${VERSION%-SNAPSHOT}" >> "$GITHUB_OUTPUT"

  sync-docs:
    name: Sync docs into charts-docs
    needs: resolve
    uses: ./.github/workflows/sync-snapshot-docs.yml
    with:
      source-ref: ${{ needs.resolve.outputs.source_sha }}
      release-notes-version: ${{ needs.resolve.outputs.release_notes_version }}
    secrets:
      CHARTS_WORKFLOW_TOKEN: ${{ secrets.CHARTS_WORKFLOW_TOKEN }}
