# Reusable compile check for pull request orchestration.
name: Compile

on:
  workflow_call:
    inputs:
      should-run:
        description: Whether the pull request contains code or build changes.
        required: true
        type: boolean
      source-sha:
        description: Immutable merge revision being checked.
        required: true
        type: string

permissions:
  contents: read

jobs:
  skipped:
    name: Docs-only no-op
    if: ${{ !inputs.should-run }}
    runs-on: ubuntu-latest
    steps:
      - name: Report docs-only no-op
        run: echo 'No code changes require the compile check.'

  compile:
    name: Compile
    if: ${{ inputs.should-run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ inputs.source-sha }}
      - uses: actions/setup-java@v6.0.0
        with:
          java-version: 17
          distribution: 'zulu'
          cache: gradle
      - name: Compile
        run: ./gradlew ciCompile
