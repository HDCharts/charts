name: Android Snapshot Build

on:
  workflow_dispatch:
    inputs:
      # Auto-generated from .version by sync-version-file.yml
      # VERSION_INPUT_BEGIN
      version_preview:
        description: "Version from .version (read-only preview)"
        required: true
        type: choice
        options:
          - "2.3.0-SNAPSHOT"
        default: "2.3.0-SNAPSHOT"
      # VERSION_INPUT_END

permissions:
  contents: read
  id-token: write

concurrency:
  group: android-snapshot-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-snapshot-build:
    name: Assemble Android App with Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.repository_owner == 'HDCharts' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu
          cache: gradle

      - name: Validate snapshot input
        id: snapshot
        shell: bash
        env:
          SNAPSHOT_VERSION: ${{ inputs.version_preview }}
        run: |
          set -euo pipefail
          if [[ "${SNAPSHOT_VERSION}" != *"-SNAPSHOT" ]]; then
            echo "Expected a -SNAPSHOT version, got: ${SNAPSHOT_VERSION}" >&2
            exit 1
          fi
          echo "version=${SNAPSHOT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Assemble androidApp debug with snapshot dependencies
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :androidApp:assembleDebug \
            -PchartsDependencyMode=snapshot \
            -PchartsPublishedVersion=${{ steps.snapshot.outputs.version }} \
            --no-daemon \
            --stacktrace

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload APK to S3
        env:
          DOCS_STATIC_BUCKET: ${{ vars.DOCS_STATIC_BUCKET }}
          SNAPSHOT_VERSION: ${{ steps.snapshot.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          
          if [[ -z "${DOCS_STATIC_BUCKET:-}" ]]; then
            echo "Missing required repository variable: DOCS_STATIC_BUCKET" >&2
            exit 1
          fi
          
          apk_path="androidApp/build/outputs/apk/debug/androidApp-debug.apk"
          if [[ ! -f "${apk_path}" ]]; then
            echo "APK not found at: ${apk_path}" >&2
            exit 1
          fi
          
          bucket_uri="s3://${DOCS_STATIC_BUCKET}/static"
          cache_control="no-store, max-age=0"
          
          # Upload APK to S3
          aws s3 cp "${apk_path}" "${bucket_uri}/android/snapshot/HDCharts-${SNAPSHOT_VERSION}.apk" \
            --content-type "application/vnd.android.apk" \
            --cache-control "${cache_control}" \
            --only-show-errors

          echo "APK uploaded successfully: HDCharts-${SNAPSHOT_VERSION}.apk"

      - name: Publish run summary
        env:
          SNAPSHOT_VERSION: ${{ steps.snapshot.outputs.version }}
          DOCS_STATIC_BUCKET: ${{ vars.DOCS_STATIC_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          echo "### Android Snapshot Build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Snapshot version: \`${SNAPSHOT_VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gradle task: \`:androidApp:assembleDebug\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: \`s3://${DOCS_STATIC_BUCKET}/static/android/snapshot/HDCharts-${SNAPSHOT_VERSION}.apk\`" >> "$GITHUB_STEP_SUMMARY"
