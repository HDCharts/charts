# Workflow: assemble the Android app for a snapshot version.
# It validates the selected version, decodes the signing keystore, and builds snapshot APKs.
#
# This is the manual Android snapshot build path.
name: Android Snapshot Build
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: android-snapshot-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-snapshot-build:
    name: Assemble Android App with Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.repository_owner == 'HDCharts' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu
          cache: gradle

      - name: Resolve snapshot version
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT_VERSION="$(./gradlew -q currentVersion \
            | awk 'NF {v=$NF} END {gsub(/\r/, "", v); print v}')"
          if [[ -z "${SNAPSHOT_VERSION:-}" ]]; then
            echo "Failed to resolve snapshot version." >&2
            exit 1
          fi
          if [[ "${SNAPSHOT_VERSION}" != *"-SNAPSHOT" ]]; then
            echo "Expected a -SNAPSHOT version, got: ${SNAPSHOT_VERSION}" >&2
            exit 1
          fi
          echo "version=${SNAPSHOT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Prepare Android signing
        uses: ./.github/actions/prepare-android-signing
        with:
          keystore-base64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          store-password: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}

      - name: Assemble androidApp release with snapshot dependencies
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :androidApp:assembleRelease \
            -PchartsDependencyMode=snapshot \
            -PchartsPublishedVersion=${{ steps.snapshot.outputs.version }} \
            --no-daemon

      - name: Remove Android signing keystore
        if: always()
        shell: bash
        run: rm -f androidApp/release.keystore

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload APK to S3
        env:
          DOCS_STATIC_BUCKET: ${{ vars.DOCS_STATIC_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          
          if [[ -z "${DOCS_STATIC_BUCKET:-}" ]]; then
            echo "Missing required repository variable: DOCS_STATIC_BUCKET" >&2
            exit 1
          fi
          
          apk_path="androidApp/build/outputs/apk/release/androidApp-release.apk"
          if [[ ! -f "${apk_path}" ]]; then
            echo "APK not found at: ${apk_path}" >&2
            exit 1
          fi
          
          bucket_uri="s3://${DOCS_STATIC_BUCKET}/static"
          cache_control="no-store, max-age=0"
          
          # Upload APK to S3
          aws s3 cp "${apk_path}" "${bucket_uri}/android/snapshot/hdcharts-snapshot.apk" \
            --content-type "application/vnd.android.package-archive" \
            --cache-control "${cache_control}" \
            --only-show-errors

      - name: Publish run summary
        env:
          SNAPSHOT_VERSION: ${{ steps.snapshot.outputs.version }}
          DOCS_STATIC_BUCKET: ${{ vars.DOCS_STATIC_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          echo "### Android Snapshot Build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Snapshot version: \`${SNAPSHOT_VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gradle task: \`:androidApp:assembleRelease\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: \`s3://${DOCS_STATIC_BUCKET}/static/android/snapshot/hdcharts-snapshot.apk\`" >> "$GITHUB_STEP_SUMMARY"
