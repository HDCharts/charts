kotlin.code.style=official

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx4096M"

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.experimental.enableScreenshotTest=true

#MPP
kotlin.mpp.enableCInteropCommonization=true

#Development
development=true

#Performance
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.caching=true

#Experimenal
org.jetbrains.compose.experimental.jscanvas.enabled=true

#Dokka v2 migration
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled

# Local dependency resolution mode for demo apps:
# - local (default): resolve charts modules from this checkout.
# - maven: resolve io.github.hdcharts artifacts from Maven repositories (requires chartsPublishedVersion).
# - snapshot: resolve io.github.hdcharts snapshot artifacts only (requires chartsPublishedVersion ending with -SNAPSHOT).
# chartsDependencyMode=local
# chartsPublishedVersion=3.0.0-SNAPSHOT

# Axion version increment strategy: incrementMajor | incrementMinor | incrementPatch
chartsVersionIncrementer=incrementMajor

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
